name: astrbot_plugin_deskhand
desc: 精准 Windows GUI 操控 — 通过 MS UI Automation 让 LLM Agent 控件级操控桌面
help: |
  安装后 LLM 可通过以下 9 个 Tool 操控 Windows GUI：

  desk_state       — 采集控件树（支持 target/mode=interactive/coords）
  desk_click       — 点击/悬停（左右中键/双击/悬停）
  desk_type         — 输入文本（支持行编辑/verify分级）
  desk_press       — 键盘组合键（Ctrl+C等）
  desk_drag         — 拖拽（控件间/坐标）
  desk_scroll      — 滚动（UIA ScrollPattern/mouse_wheel回退）
  desk_select      — 选中文本范围
  desk_window      — 窗口管理（最小化/最大化/关闭/置顶/移动/调大小）
  desk_screenshot  — 截图（可选控件框标注）

  所有操作支持 verify=full/light/none 三档验证。
  Chromium/Electron/Tauri WebView 自动穿透。
version: v1.0.0
author: irmia2026
repo: https://github.com/irmia2026/astrbot_plugin_deskhand
