name: astrbot_plugin_deskhand
display_name: 弥亚之手
desc: 视觉方案 Windows 桌面操控 — 截图 + 本地 OCR + VL 模型三级定位，让 LLM Agent 操作任意桌面软件
help: |
  DeskHand v2（视觉方案）。安装后 LLM 可使用以下 9 个 Tool 操控 Windows 桌面：

  look           — 看屏幕/窗口（VL 分析 + 本地 OCR 文字及坐标）
  scan_scene     — 场景结构识别（游戏/图形场景：VL 输出元素清单：语义+类型+坐标+提示图标，合并 OCR）
  click          — 点击（target 描述三级定位：记忆→OCR→VL 漏斗；或 x/y 裸坐标）
  type_text      — 输入文本（中文等非 ASCII 自动走剪贴板粘贴；可先自动点击聚焦）
  press_key      — 组合键（扫描码通道，游戏/SDL2/DirectInput 兼容）
  scroll         — 滚动（垂直/水平，可按目标定位）
  drag           — 坐标拖拽
  wait_change    — 等待画面变化（图像 diff 轮询，替代盲等待）
  window_action  — 窗口管理（min/max/restore/close/focus/topmost/move/resize，含 hwnd 记忆）

  工程增强（不纯依赖 VL 模型）：
  - 元素记忆库：成功定位过的元素下次直接用历史坐标 + 图像签名验证，0 次模型调用
  - 本地 OCR：文字类目标直接拿到精确像素坐标，不需要 VL 输出坐标
  - VL 网格漏斗：VL 只做粗定位（格子），裁剪放大后精定位，对抗图片 token 上限
  - hover-verify：点击前局部截图让 VL 确认落点，大幅降低点错率
  - ImageChops diff：动作前后确定性验证「画面是否变化」

  VL 模型配置：优先复用同时安装的 irmia_vision 插件的降级链；
  否则用本插件配置的 vl_provider_1/2/3（下拉）或 vl_model（手动）。
  本地 OCR 为可选增强：pip install winsdk 或 rapidocr-onnxruntime。
version: v2.2.2
author: irmia2026
repo: https://github.com/irmia2026/astrbot_plugin_deskhand
